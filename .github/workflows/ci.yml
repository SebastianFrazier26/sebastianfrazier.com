name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Fails only on high/critical findings; lower severities are reported.
      - run: pnpm audit --audit-level=high
      # The fixture world: a real cabn build with no network and no token,
      # so the production build (and its dist checks) run on every PR.
      - run: pnpm build:fixture
      - run: pnpm build
      - run: node scripts/render-caddyfile.ts Caddyfile Caddyfile.rendered
