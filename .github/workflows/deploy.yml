name: Deploy

# push and workflow_dispatch always rebuild; the schedule rebuilds only when
# a project's upstream branch, this repo's commit or the cabn version moved
# past what the live /worlds/manifest.json says (scripts/upstream-changed.ts).
# Project repos trigger instant updates with workflow_dispatch (README:
# "Instant updates"). Everything no-ops until RAILWAY_TOKEN exists.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable this one from the Actions tab if that happens.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  # gh run list, for the scheduled run's "is a deploy already pending?" check.
  actions: read

# Scheduled runs get their own group: in a shared one, a newer pending run
# replaces an older pending one, so a cron tick could silently drop a queued
# push deploy. Instead a scheduled run yields when any other deploy is queued
# or running, and the manifest's siteSha catches a push that never shipped.
concurrency:
  group: deploy-${{ github.event_name == 'schedule' && 'scheduled' || 'release' }}
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can name any branch; only main ever deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Through env, not interpolated: an expression is pasted into the
      # script text before the shell parses it.
      - name: Check for RAILWAY_TOKEN
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not set — skipping deploy. See README's 'Owner setup'."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.configured == 'true'

      - name: Decide whether to deploy
        id: decide
        if: steps.check.outputs.configured == 'true'
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}
          DEPLOYED_MANIFEST_URL: ${{ vars.DEPLOYED_MANIFEST_URL }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          busy=$(gh run list --repo "$REPO" --workflow deploy.yml --limit 30 \
            --json databaseId,status,event \
            --jq "[.[] | select(.databaseId != $RUN_ID and .event != \"schedule\" and (.status | IN(\"queued\",\"in_progress\",\"waiting\",\"pending\",\"requested\")))] | length")
          if [ "$busy" != "0" ]; then
            echo "Another deploy is queued or running; this scheduled run yields to it."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm upstream-changed

      # Same gate as CI, so a scheduled or dispatched run can't ship a site
      # that main's own checks would reject.
      - name: Lint, typecheck, test
        if: steps.decide.outputs.changed == 'true'
        run: pnpm lint && pnpm typecheck && pnpm test
      - name: Build worlds from upstream
        if: steps.decide.outputs.changed == 'true'
        env:
          # A fine-grained, read-only token for private projects; the
          # workflow's own token covers public repos (and the rate limit).
          GITHUB_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN || github.token }}
        run: pnpm build:worlds
      - name: Build the site
        if: steps.decide.outputs.changed == 'true'
        run: pnpm build

      # The npm package's postinstall downloads this same binary without any
      # checksum, so the release asset is fetched directly and verified
      # against a hash pinned when the version was chosen.
      - name: Install Railway CLI (pinned, checksummed)
        if: steps.decide.outputs.changed == 'true'
        env:
          RAILWAY_VERSION: "5.63.1"
          RAILWAY_SHA256: cbb559de44cd304cf9d6598a4ea77575035a0e6e3215370bb3b105b8f48235cc
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/railway.tgz" \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_VERSION}/railway-v${RAILWAY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RAILWAY_SHA256}  $RUNNER_TEMP/railway.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/railway.tgz" -C "$RUNNER_TEMP" railway
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Deploy to Railway
        if: steps.decide.outputs.changed == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --no-gitignore: public/worlds/ is gitignored but is the payload.
        run: railway up --ci --service portfolio --no-gitignore
